name: generate-sources

on:
  push:
    paths:
      - '.github/workflows/generate-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build the remapped sources
        run: |
          set -euo pipefail
          bash tools/fetch_mappings.sh
          mkdir -p downloads
          unzip -q Hachimi-2.0.jar_Decompiler.com.zip -d downloads/Hachimi-2.0.jar_Decompiler.com
          python3 tools/remap_yarn.py --apply
          python3 tools/aw_to_named.py
          python3 tools/fix_artifacts.py
          python3 tools/fix_syntax.py
          mkdir -p src/main/resources/assets
          cp -r downloads/Hachimi-2.0.jar_Decompiler.com/assets/. src/main/resources/assets/
          gradle build > /tmp/build.log 2>&1 || true
          echo "pierwszy build, bledy: $(grep -c 'error:' /tmp/build.log || true)"
          python3 tools/fix_artifacts2.py /tmp/build.log
          python3 tools/fix_artifacts3.py
          python3 tools/fix_artifacts4.py
          gradle build

      - name: Commit sources
        run: |
          set -euo pipefail
          rm -rf src/main/java
          mkdir -p src/main/java
          cp -r downloads/Hachimi-2.0.jar_Decompiler.com/net src/main/java/net
          cp -r downloads/Hachimi-2.0.jar_Decompiler.com/meteordevelopment src/main/java/meteordevelopment
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java
          git commit -m 'Add remapped Yarn source tree for Hachimi 2.0'
          git push
