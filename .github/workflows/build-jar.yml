name: build-jar

on:
  push:
    paths:
      - '.github/workflows/build-jar.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Restore build config from history
        run: |
          set -euo pipefail
          SRC=65a52381cc88e61e551383559e1f1b26d73d1c3d
          git show $SRC:build.gradle > build.gradle
          git show $SRC:settings.gradle > settings.gradle
          git show $SRC:gradle.properties > gradle.properties
          mkdir -p src/main/resources
          git show $SRC:src/main/resources/hachimi.accesswidener > src/main/resources/hachimi.accesswidener
          git show $SRC:src/main/resources/fabric.mod.json > src/main/resources/fabric.mod.json
          git show $SRC:src/main/resources/mixins.hachimi.json > src/main/resources/mixins.hachimi.json
          perl -0pi -e "s{srcDirs = \[.*?\]}{srcDirs = ['src/main/java']}s" build.gradle
          grep -n 'srcDirs' build.gradle

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p downloads
          unzip -q Hachimi-2.0.jar_Decompiler.com.zip -d downloads/unpacked
          mkdir -p src/main/resources/assets
          cp -r downloads/unpacked/assets/. src/main/resources/assets/
          gradle build
          ls -l build/libs

      - name: Publish jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          cp build/libs/hachimi-2.0.jar Hachimi-2.0-built.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f Hachimi-2.0-built.jar
          git commit -m 'Add built Hachimi 2.0 jar' --quiet || true
          if git push origin HEAD:main 2>/tmp/err.txt; then
            echo 'jar wypchniety do repo'
            exit 0
          fi
          echo '--- git push failed ---'
          cat /tmp/err.txt
          if gh release create v2.0 Hachimi-2.0-built.jar --title 'Hachimi 2.0' --notes 'Zbudowany jar: Fabric 1.21.1, loader 0.16+.'; then
            echo 'jar opublikowany jako release v2.0'
            exit 0
          fi
          gh issue create --title 'build-jar: publikacja jara nieudana' --body "$(tail -c 1200 /tmp/err.txt)" || true
          exit 1
